[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbix2html"
version = "0.1.0"
description = "Power BI report (.pbix, DirectQuery Teradata) to HTML migration"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "pyyaml>=6",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "pbixray>=0.11",
  "teradatasql>=20.0",
]

[project.optional-dependencies]
live = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
verify = ["playwright>=1.40"]
dev = ["pytest>=8", "ruff>=0.4", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29", "python-multipart>=0.0.9",
       "sqlglot>=23", "playwright>=1.40"]

[project.scripts]
pbix2html = "pbix2html.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pbix2html = ["templates/*.j2", "templates/*.js", "gui_templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["teradata: requires a real Teradata connection"]
# Silences a pytest-asyncio DeprecationWarning printed on every run. Nothing here uses
# async fixtures; pinning the scope just stops the warning from burying a real one.
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"
