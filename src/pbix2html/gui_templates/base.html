<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}pbix2html{% endblock %} — panel</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1f2328; --muted: #6b7280;
    --border: #e3e5e8; --accent: #0f6fde; --accent-text: #ffffff;
    --ok-bg: #eaf7ec; --ok-text: #1a7f37; --err-bg: #fdecea; --err-text: #b3261e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 'Segoe UI', system-ui, -apple-system, sans-serif; }
  header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 14px 20px; }
  header a { color: var(--text); text-decoration: none; font-weight: 600; font-size: 17px; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
          padding: 18px 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .step { display: flex; align-items: baseline; gap: 8px; }
  .step .n { background: var(--accent); color: var(--accent-text); border-radius: 999px;
             width: 22px; height: 22px; display: inline-flex; align-items: center;
             justify-content: center; font-size: 12px; font-weight: 700; flex: none; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; background: #fff; color: var(--text);
  }
  textarea { font-family: 'Cascadia Code', Consolas, monospace; font-size: 13px; resize: vertical; }
  .radios, .checkbox-row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .checkbox-row label { margin: 0; color: var(--text); font-size: 14px; }
  button, .btn {
    background: var(--accent); color: var(--accent-text); border: none; border-radius: 6px;
    padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-block;
    text-decoration: none; margin-top: 12px;
  }
  button.secondary, .btn.secondary { background: #eef1f5; color: var(--text); }
  button:hover, .btn:hover { opacity: .92; }
  .banner { border-radius: 8px; padding: 12px 16px; margin-bottom: 18px; }
  .banner.ok { background: var(--ok-bg); color: var(--ok-text); }
  .banner.err { background: var(--err-bg); color: var(--err-text); }
  .banner ul { margin: 8px 0 0; padding-left: 20px; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; margin-left: 8px; }
  .badge.yes { background: var(--ok-bg); color: var(--ok-text); }
  .badge.no { background: #eef1f5; color: var(--muted); }
  .badge.optional { background: #fff4e0; color: #9a6700; text-transform: uppercase; letter-spacing: .02em; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: left; font-size: 14px; }
  a.link { color: var(--accent); }
  fieldset { border: none; padding: 0; margin: 0; }
</style>
</head>
<body>
<header><a href="/">⟲ pbix2html — panel</a></header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
