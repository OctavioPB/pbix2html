# Annotated template for metrics/<Report>.yaml. `pbix2html scaffold` generates one from the .pbix.
report: Report_Name                 # = the .pbix name without the extension
source: reports/Report_Name.pbix
connection: teradata
delivery: snapshot                  # snapshot | live   (ADR-001)

parameters:                         # one per slicer (and per unlocked page filter)
  year:
    type: int                       # int | string | date
    default: 2026
    from_slicer: Calendar.Year      # the slicer's queryRef in layout.json
    multi: false                    # true → list; used as IN (:param) in SQL
    label: Year

roles:                              # from model.json → rls, or defined by hand
  Sales_North:
    proxy_user: usr_north           # trusted session (live mode and per-role snapshot)
    where: null                     # alternative: a fixed predicate the yaml must include
    dax: "[Region] = LOOKUPVALUE(...)"   # documentation only

visuals:
  v1:                               # id = the visual's config.name in layout.json
    kind: card                      # see the column contract in the html-renderer skill
    title: Net Revenue
    fields:                         # documentation only (filled in by scaffold)
      - "Values: Sales.Net Revenue  -- DAX: SUM(Sales[Amount])"
    sql: |
      SELECT SUM(v.amount) AS "value"
      FROM sec.v_sales v
      JOIN dim_calendar c ON c.date = v.date
      WHERE c.year = :year
    params: [year]
    reference_sql: |                # SQL captured from DBQL (what Power BI ran). For validation only.
      SELECT SUM("amount") FROM ...
    format: { value: "#,##0" }
    tolerance: { rel: 1.0e-6 }      # or { abs: 0.5 }
    notes: null
  v2:
    kind: bar
    title: Margin by Region
    sql: |
      SELECT r.name AS category, SUM(v.margin) / NULLIFZERO(SUM(v.amount)) AS "value"
      FROM sec.v_sales v JOIN dim_region r ON r.id = v.region_id
      JOIN dim_calendar c ON c.date = v.date
      WHERE c.year = :year
      GROUP BY 1 ORDER BY 2 DESC
    params: [year]
    format: { value: "0.0%" }
