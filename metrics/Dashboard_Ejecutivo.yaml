# Working example against the tests' synthetic .pbix (no Teradata; see tests/test_pipeline.py)
report: Dashboard_Ejecutivo
connection: teradata
delivery: snapshot
parameters:
  anio: { type: int, default: 2026, from_slicer: Calendario.Anio, label: Año }
roles:
  default: { proxy_user: null }
visuals:
  v1:
    kind: card
    title: Ingresos netos
    sql: SELECT SUM(importe) AS value FROM ventas WHERE anio = :anio
    params: [anio]
    format: { value: "#,##0" }
  v2:
    kind: bar
    title: Margen por región
    sql: SELECT region AS category, margen AS value FROM v_margen_region WHERE anio = :anio
    params: [anio]
    format: { value: "0.0%" }
  v4:
    kind: column
    title: Custom (Deneb) reinterpretado
    sql: SELECT mes AS category, importe AS value FROM v_ingresos_mes WHERE anio = :anio
    params: [anio]
    notes: "Custom visual Deneb reinterpretado como columnas; se pierde la anotación original."
  v5:
    kind: table
    sql: SELECT cliente, importe FROM v_top_clientes WHERE anio = :anio
    params: [anio]
    format: { importe: "#,##0.00" }
